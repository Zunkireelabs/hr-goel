services:
  app:
    container_name: hr-goel-web-prod
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - hosting
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      # HTTPS router — primary domain
      # TODO(Sadin): replace REPLACE_PROD_DOMAIN with the actual production domain before deploying
      - "traefik.http.routers.hr-goel-web-prod.rule=Host(`REPLACE_PROD_DOMAIN`)"
      - "traefik.http.routers.hr-goel-web-prod.entrypoints=websecure"
      - "traefik.http.routers.hr-goel-web-prod.tls=true"
      - "traefik.http.routers.hr-goel-web-prod.tls.certresolver=letsencrypt"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.hr-goel-web-prod-http.rule=Host(`REPLACE_PROD_DOMAIN`)"
      - "traefik.http.routers.hr-goel-web-prod-http.entrypoints=web"
      - "traefik.http.routers.hr-goel-web-prod-http.middlewares=hr-goel-web-prod-redirect"
      - "traefik.http.middlewares.hr-goel-web-prod-redirect.redirectscheme.scheme=https"
      # Service port
      - "traefik.http.services.hr-goel-web-prod.loadbalancer.server.port=80"

      # ── www domain (uncomment if a PROD_DOMAIN_WWW is set) ──────────────
      # - "traefik.http.routers.hr-goel-web-prod-www.rule=Host(`REPLACE_PROD_DOMAIN_WWW`)"
      # - "traefik.http.routers.hr-goel-web-prod-www.entrypoints=websecure"
      # - "traefik.http.routers.hr-goel-web-prod-www.tls=true"
      # - "traefik.http.routers.hr-goel-web-prod-www.tls.certresolver=letsencrypt"
      # - "traefik.http.routers.hr-goel-web-prod-www-http.rule=Host(`REPLACE_PROD_DOMAIN_WWW`)"
      # - "traefik.http.routers.hr-goel-web-prod-www-http.entrypoints=web"
      # - "traefik.http.routers.hr-goel-web-prod-www-http.middlewares=hr-goel-web-prod-redirect"

networks:
  hosting:
    external: true
