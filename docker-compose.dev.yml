services:
  app:
    container_name: hr-goel-web-stage
    build:
      context: .
      dockerfile: Dockerfile
    networks:
      - hosting
    restart: unless-stopped
    environment:
      - CRM_API_KEY=${CRM_API_KEY:?CRM_API_KEY is not set}
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=hosting"
      # HTTPS router
      - "traefik.http.routers.hr-goel-web-stage.rule=Host(`hr-goel.zunkireelabs.com`)"
      - "traefik.http.routers.hr-goel-web-stage.entrypoints=websecure"
      - "traefik.http.routers.hr-goel-web-stage.tls=true"
      - "traefik.http.routers.hr-goel-web-stage.tls.certresolver=letsencrypt"
      # HTTP → HTTPS redirect
      - "traefik.http.routers.hr-goel-web-stage-http.rule=Host(`hr-goel.zunkireelabs.com`)"
      - "traefik.http.routers.hr-goel-web-stage-http.entrypoints=web"
      - "traefik.http.routers.hr-goel-web-stage-http.middlewares=hr-goel-web-stage-redirect"
      - "traefik.http.middlewares.hr-goel-web-stage-redirect.redirectscheme.scheme=https"
      # Service port
      - "traefik.http.services.hr-goel-web-stage.loadbalancer.server.port=80"

networks:
  hosting:
    external: true
